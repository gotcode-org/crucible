<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2FA Verification — Crucible Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-full flex flex-col justify-center items-center p-4 bg-grid antialiased selection:bg-emerald-500/30 selection:text-emerald-200 relative overflow-hidden">

  <!-- Ambient Glow -->
  <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[300px] bg-emerald-500/10 rounded-full blur-[140px] pointer-events-none"></div>

  <main class="w-full max-w-md relative z-10">
    <!-- Top Status Strip -->
    <div class="flex items-center justify-between px-4 py-2 rounded-t-xl bg-zinc-900/90 border border-b-0 border-zinc-800 text-xs font-mono">
      <div class="flex items-center gap-2 text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>STEP 02 / 02 :: TOTP CHALLENGE</span>
      </div>
      <span class="text-zinc-400 truncate max-w-[160px]">{{ .Username }}</span>
    </div>

    <!-- Main Challenge Box -->
    <div class="bg-zinc-900/60 backdrop-blur-xl border border-zinc-800 rounded-b-xl p-6 sm:p-8 shadow-2xl space-y-6">
      <div class="flex items-start gap-4">
        <div class="w-11 h-11 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight">Two-Factor Verification</h1>
          <p class="text-zinc-400 text-xs mt-1 leading-relaxed">
            Enter the 6-digit security code generated by your authenticator device.
          </p>
        </div>
      </div>

      {{ if .Error }}
      <div class="rounded-lg bg-rose-500/10 border border-rose-500/30 px-3.5 py-2.5 text-xs text-rose-400 font-mono text-center">
        {{ .Error }}
      </div>
      {{ end }}

      <form action="/auth/2fa" method="POST" class="space-y-6">
        <input type="hidden" name="challenge_token" value="{{ .ChallengeToken }}" />

        <div>
          <label for="passcode" class="block text-xs font-mono uppercase tracking-wider text-zinc-400 mb-2">6-Digit Passcode</label>
          <input
            type="text"
            id="passcode"
            name="passcode"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            required
            autofocus
            autocomplete="one-time-code"
            placeholder="123456"
            class="w-full text-center text-2xl tracking-[0.5em] font-mono py-3 bg-zinc-950 border border-zinc-800 rounded-lg text-emerald-400 focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/30 outline-none transition-all"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2.5 px-4 rounded-lg text-sm font-semibold text-zinc-950 bg-gradient-to-r from-emerald-400 to-cyan-400 hover:from-emerald-300 hover:to-cyan-300 shadow-lg shadow-emerald-500/15 transition-all active:scale-[0.99] flex items-center justify-center gap-2 cursor-pointer"
        >
          <span>Verify & Unlock</span>
          <span class="font-mono">&rarr;</span>
        </button>

        <div class="text-center pt-2">
          <a href="/login" class="text-xs font-mono text-zinc-500 hover:text-zinc-300 transition-colors">
            &larr; Back to Operator Sign In
          </a>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
